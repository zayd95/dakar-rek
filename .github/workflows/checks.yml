name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # city + two-player + full launch suites take 10–15 min on a runner; 15 cut runs off mid-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:city
      - run: npm run check:online
      - run: npm run check:launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-checks
          path: |
            shots/multiplayer/
            shots/launch-controls/
            shots/launch-gameplay/
            shots/city-life/
          if-no-files-found: ignore

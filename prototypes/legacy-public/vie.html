<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dakar Life : vis ta vie à Dakar. Car rapide, ceebu jën, lutte, tontine et délestage.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Dakar Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column — car-rapide stripe band, compact HUD, painted Cap-Vert peninsula map, action list, bottom tab bar; two columns on desktop */
:root{
  --paper:#E9EFF3; --card:#FFFFFF; --ink:#13202F; --muted:#5A6A7B; --line:rgba(19,32,47,.12); --chip:#EDF2F6;
  --yellow:#F2B300; --blue:#1A4C9C; --on-yellow:#13202F; --glass:#BCD7EA;
  --sea:#8BBCDD; --sea-ink:#4A88B8; --land:#F1E6CC; --land-edge:#CDB688; --lac:#E59AB6; --night:#0A1B3D;
  --food:#CF3B27; --work:#1A4C9C; --fun:#0B8A50; --shop:#B37C00; --home:#13202F;
  --good:#157544; --bad:#BE2A40; --warn:#A86200;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:62px; --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#08121D; --card:#101E2F; --ink:#E6EDF4; --muted:#93A4B7; --line:rgba(230,237,244,.13); --chip:#172A40;
  --blue:#3D70C9; --glass:#2B4A66;
  --sea:#0E2943; --sea-ink:#2A5884; --land:#263245; --land-edge:#46566F; --lac:#8E4A66; --night:#000814;
  --food:#F06A52; --work:#6F9CEB; --fun:#3BC27D; --shop:#E5B238; --home:#E6EDF4;
  --good:#4CC386; --bad:#F06B80; --warn:#F0A53D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#08121D; --card:#101E2F; --ink:#E6EDF4; --muted:#93A4B7; --line:rgba(230,237,244,.13); --chip:#172A40;
  --blue:#3D70C9; --glass:#2B4A66;
  --sea:#0E2943; --sea-ink:#2A5884; --land:#263245; --land-edge:#46566F; --lac:#8E4A66; --night:#000814;
  --food:#F06A52; --work:#6F9CEB; --fun:#3BC27D; --shop:#E5B238; --home:#E6EDF4;
  --good:#4CC386; --bad:#F06B80; --warn:#F0A53D; color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.app{max-width:540px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));min-height:100%}
.muted{color:var(--muted)}
.stripe{height:9px;margin-inline:-16px;background:
  linear-gradient(var(--blue),var(--blue)) top/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--yellow) 0 26px,var(--food) 26px 30px,var(--yellow) 30px 56px,var(--fun) 56px 60px)}
.stripe.sm{margin-inline:0;border-radius:6px 6px 0 0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- onboarding */
.onboard{display:flex;flex-direction:column;gap:22px;padding-block:0 32px}
.ob-hero{display:flex;flex-direction:column;gap:10px;padding-top:22px}
.logo{font-family:var(--f-display);font-size:clamp(44px,13vw,64px);line-height:.92;letter-spacing:.01em;color:var(--blue)}
.logo span{display:block;color:var(--yellow);-webkit-text-stroke:1.5px var(--on-yellow);paint-order:stroke fill}
.ob-hero p{font-size:17px;max-width:34ch}
.car{width:min(320px,100%);height:auto;display:block;margin-top:4px}
.car .body{animation:drive 1.4s cubic-bezier(.2,.8,.2,1) both}
.car .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes drive{from{transform:translateX(-110%)}to{transform:none}}
@keyframes spin{from{transform:rotate(-720deg)}to{transform:none}}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:700;font-size:13px}
.input{font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.input:focus{border-color:var(--blue);outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.starts{display:grid;grid-template-columns:1fr;gap:10px}
.start{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.start b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.01em}
.start small{color:var(--muted);font-size:13.5px}
.start .tag{font-size:12px;font-weight:700;color:var(--blue)}
.start[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--yellow);color:var(--on-yellow);box-shadow:0 3px 0 var(--on-yellow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--on-yellow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:9px 13px;font-size:14px;border-radius:11px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-bottom:10px;margin-inline:-16px;padding-inline:16px;box-shadow:0 1px 0 var(--line)}
.hud .stripe{margin-bottom:10px}
.hud-row{display:flex;align-items:center;gap:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.av.lg{width:56px;height:56px;font-size:24px}
.hud-id{flex:1;min-width:0}
.hud-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-time{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-time svg{width:13px;height:13px;flex:none}
.hud-money{text-align:right}
.hud-money b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-money small{font-size:11.5px;color:var(--muted)}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.need{display:flex;flex-direction:column;gap:4px;min-width:0}
.need span{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.need .bar{height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.need .bar i{display:block;height:100%;border-radius:4px;background:var(--fun);transition:width .5s}
.need.mid .bar i{background:var(--shop)}
.need.low .bar i{background:var(--bad)}
.need.low span{color:var(--bad)}
.banners{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.banners::-webkit-scrollbar{display:none}
.bn{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.bn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}

/* ---------- views */
.view{padding-top:14px}
.mapcard{position:relative;border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 1px var(--line)}
#map{display:block;width:100%;height:auto;aspect-ratio:400/290;max-width:100%;touch-action:manipulation}
.m-sea{fill:var(--sea)}
.m-wave{fill:none;stroke:var(--sea-ink);stroke-width:.8;opacity:.45}
.m-land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.4;stroke-linejoin:round}
.m-lac{fill:var(--lac);stroke:var(--land-edge);stroke-width:.8}
.m-ter{fill:none;stroke:var(--blue);stroke-width:1.6;stroke-dasharray:5 3;opacity:.55}
.m-brt{fill:none;stroke:var(--shop);stroke-width:1.6;stroke-dasharray:2 3;opacity:.7}
.m-water{fill:var(--sea-ink);font:700 7px var(--f-body);letter-spacing:.28em}
.m-night{fill:var(--night);pointer-events:none;transition:opacity .8s}
.pin{cursor:pointer}
.pin-hit{fill:transparent}
.pin-dot{stroke:var(--card);stroke-width:2.2;transition:r .2s}
.c-food{fill:var(--food)} .c-work{fill:var(--work)} .c-fun{fill:var(--fun)} .c-shop{fill:var(--shop)} .c-home{fill:var(--home)}
.pin-home{fill:var(--home);stroke:var(--card);stroke-width:2;stroke-linejoin:round}
.pin.closed .pin-dot{opacity:.55}
.pin.on .pin-dot,.pin.on .pin-home{stroke:var(--yellow);stroke-width:3}
.pin-lbl{font:700 9.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.pin:focus{outline:none}
.pin:focus-visible .pin-dot{stroke:var(--blue);stroke-width:3}
.me-ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(2);opacity:0}}
.me-ini{font:800 9px var(--f-body);fill:#fff;pointer-events:none}
.peer{stroke:var(--card);stroke-width:1.5}
.peer-n{font:800 7px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:2.5px}
.map-legend{position:absolute;right:8px;top:8px;max-width:72%;justify-content:flex-end;display:flex;gap:5px;flex-wrap:wrap;font-size:10px;font-weight:700;color:var(--ink);pointer-events:none}
.map-legend span{display:flex;align-items:center;gap:4px;background:var(--card);padding:2px 7px;border-radius:999px;opacity:.92}
.map-legend i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-block:12px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.chip.here::after{content:"ici";font-size:10px;font-weight:800;background:var(--yellow);color:var(--on-yellow);padding:1px 6px;border-radius:999px}

.panel{margin-top:12px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:150px}
.ph{display:flex;flex-direction:column;gap:6px}
.ph h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05;letter-spacing:.005em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.here{background:var(--yellow);color:var(--on-yellow)}
.pill.open{color:var(--good)} .pill.shut{color:var(--bad)}
.desc{color:var(--muted);font-size:14px;max-width:60ch}
.travel{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:0 0 0 1px var(--line)}
.travel-h{font-weight:800;font-size:13px;margin-bottom:8px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-radius:12px;padding:10px 11px;background:var(--chip);cursor:pointer;min-width:0}
.tbtn b{font-size:14px}
.tbtn span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbtn em{font-style:normal;font-size:11.5px;color:var(--blue);font-weight:600}
.tbtn:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--ink)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.tbtn.best{background:var(--yellow);color:var(--on-yellow)}
.tbtn.best span,.tbtn.best em{color:var(--on-yellow)}
.peers-here{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.peers-here .dots{display:flex}
.peers-here .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);margin-left:-5px}
.peers-here .dots i:first-child{margin-left:0}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.acts{display:flex;flex-direction:column;gap:7px}
.act{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border:0;background:var(--card);border-radius:14px;padding:11px 13px;box-shadow:0 0 0 1px var(--line);cursor:pointer;width:100%}
.act:hover:not(:disabled){box-shadow:0 0 0 1.5px var(--ink)}
.act:active:not(:disabled){transform:scale(.99)}
.act:disabled{cursor:not-allowed}
.act:disabled .act-label{color:var(--muted)}
.act-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.act-label{font-weight:700;font-size:14.5px}
.act-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.act-why{font-size:12px;color:var(--bad);font-weight:600}
.act-fx{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 44%}
.fx{font-style:normal;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--chip);white-space:nowrap;font-variant-numeric:tabular-nums}
.fx.up{color:var(--good)} .fx.dn{color:var(--bad)} .fx.money{color:var(--shop)}
.info-row{display:flex;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:14px;background:var(--chip);font-size:14px}
.info-row b{font-weight:700}
.info-row span{color:var(--muted);font-size:12.5px;text-align:right}

/* ---------- cards (Moi / Live / Journal) */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.idcard{flex-direction:row;align-items:center;gap:14px}
.idcard h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.goal{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.goal .bar,.meter .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.goal .bar i,.meter .bar i{display:block;height:100%;background:var(--yellow);border-radius:4px}
.badge{align-self:flex-start;font-weight:800;font-size:13px;background:var(--yellow);color:var(--on-yellow);padding:5px 11px;border-radius:999px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.meter{display:flex;flex-direction:column;gap:5px;font-size:13px}
.meter span{display:flex;justify-content:space-between;font-weight:700}
.meter .bar i{background:var(--blue)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
.friend{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.friend:first-child{border-top:0}
.friend b{font-size:14px} .friend small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.hearts{display:flex;gap:3px}
.hearts i{width:9px;height:9px;border-radius:2px;background:var(--chip);transform:rotate(45deg)}
.hearts i.on{background:var(--food)}
.danger{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.log{display:flex;flex-direction:column}
.log li{list-style:none;display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.log ul{margin:0;padding:0}
.log .k-money{color:var(--shop);font-weight:700} .log .k-bad{color:var(--bad)} .log .k-event{font-weight:700}

/* live */
.live-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;color:var(--blue)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.live-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.02;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:clamp(26px,8vw,34px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;overflow-wrap:anywhere}
.tile span{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile.hot{background:var(--yellow);color:var(--on-yellow);box-shadow:none}
.tile.hot span{color:var(--on-yellow)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:8px 0;border-top:1px solid var(--line);vertical-align:middle}
.lb tr:first-child td{border-top:0}
.lb .rk{width:28px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lb .nm{display:flex;align-items:center;gap:8px;min-width:0}
.lb .nm i{width:12px;height:12px;border-radius:50%;flex:none}
.lb .nw{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.lb .you{font-size:10.5px;font-weight:800;background:var(--yellow);color:var(--on-yellow);padding:1px 6px;border-radius:999px}
.zbars{display:flex;flex-direction:column;gap:8px}
.zb{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.zb .bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.zb .bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.zb b{text-align:right;font-variant-numeric:tabular-nums}
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.board{aspect-ratio:4/3;max-width:100%;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;padding:8px;background:repeating-linear-gradient(135deg,var(--chip) 0 8px,var(--card) 8px 16px);box-shadow:inset 0 0 0 2px var(--line);font-size:11.5px;color:var(--muted)}
.board b{font-family:var(--f-display);font-weight:400;font-size:12px;color:var(--ink);letter-spacing:.02em}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
a.btn{text-decoration:none}

/* ---------- nav, modal, toasts */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);z-index:30;background:var(--card);box-shadow:0 -1px 0 var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal-card{width:min(460px,100%);background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:86%;animation:up .28s ease-out}
.modal-in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.modal-in h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.08}
.modal-in p{font-size:15px}
.modal-c{display:flex;flex-direction:column;gap:8px}
.modal-c .btn{width:100%}
.mlines{display:flex;flex-direction:column;font-size:14px}
.mlines div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mlines div:first-child{border-top:0}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){.modal{align-items:center}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));width:min(508px,calc(100% - 32px));z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:up .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.toast .tfx{display:flex;gap:4px;flex-wrap:wrap}
.toast .fx{background:rgba(255,255,255,.12)}
.toast .fx.up{color:#7FE0A9} .toast .fx.dn{color:#FF9DAB} .toast .fx.money{color:#FFD15C}

@media (min-width:900px){
  .app{max-width:1000px}
  .nav{width:min(1000px,100%)}
  #v-ville{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
  .mapwrap{position:sticky;top:150px}
  .panel{margin-top:0}
  .stack.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function F(n){
  n = Math.round(n); const neg = n < 0; n = Math.abs(n); let t;
  if (n >= 1e9) t = (n/1e9).toFixed(2).replace(/\.?0+$/,'').replace('.',',') + ' Md';
  else if (n >= 1e7) t = (n/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',') + ' M';
  else t = num(n);
  return (neg ? '−' : '') + t + ' F';
}
function hhmm(h){ const t = Math.round(h*60) % 1440; return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }
function dur(h){
  if (h < 1) return Math.max(5, Math.round(h*12)*5) + ' min';
  let hh = Math.floor(h), m = Math.round((h-hh)*12)*5; if (m === 60){ hh++; m = 0; }
  return m ? hh + ' h ' + String(m).padStart(2,'0') : hh + ' h';
}
function inWin(o, h){ if (!o) return true; const [a,b] = o; return a < b ? (h >= a && h < b) : (h >= a || h < b); }
function openText(o){ if (!o) return '24 h/24'; return o[0] + ' h – ' + (o[1] === 24 ? 0 : o[1]) + ' h'; }
const todayStr = () => new Date().toISOString().slice(0,10);

const dayIdx = () => (s.day - 1) % 7;
const perk = id => (s.friends[id] || 0) >= 3;

function log(t, k){ s.log.unshift({d:s.day, h:s.hour, t, k:k||''}); if (s.log.length > 140) s.log.length = 140; }

function placeInfo(id){
  if (id === 'maison'){ const h = HOMES[s.home]; return {name:h.name, short:'Maison', q:h.q, x:h.x, y:h.y, cat:'home', open:null, rail:h.rail, island:h.island, desc:'Ton chez-toi : dormir, cuisiner, recevoir les voisins.'}; }
  return P[id];
}
function netWorth(){
  let v = s.money - s.debt;
  for (const h of s.owned) v += HOMES[h].price || 0;
  for (const k in s.biz) v += BIZ[k].price * s.biz[k];
  for (const k in s.inv) if (s.inv[k]) v += Math.round(ITEMS[k].price * (k === 'ladoum' ? 1 : .6));
  return v;
}
function sleepRate(){ return HOMES[s.home].sleep * (s.flags.delestage && !s.inv.groupe ? .55 : 1); }
function sleepHours(){ let h = (7 - s.hour + 24) % 24; if (h < 1) h = 1; return Math.min(10, h); }

// ---------------------------------------------------------------- time
function advance(hours, mode){
  let left = hours;
  while (left > 1e-6){
    const st = Math.min(left, .25), n = s.needs;
    if (mode === 'sleep'){ n.faim -= 1.6*st; n.energie += (s._rate || 10)*st; }
    else { n.faim -= 4*st; n.energie -= 3.2*st; n.moral -= 1.1*st; n.social -= .9*st; }
    for (const k in n) n[k] = clamp(n[k]);
    s.hour += st; left -= st;
    if (s.hour >= 24 - 1e-9){ s.hour -= 24; if (s.hour < 0) s.hour = 0; newDay(); }
  }
}
function newDay(){
  s.day++;
  const di = dayIdx();
  let inc = 0;
  for (const k in s.biz) inc += BIZ[k].inc * s.biz[k];
  const deals = Math.floor(s.followers / 1000) * 2500; inc += deals;
  if (inc > 0){ s.money += inc; log('Revenus du jour : +' + F(inc) + (deals ? ' (dont ' + F(deals) + ' de partenariats)' : ''), 'money'); }
  s.needs.moral = clamp(s.needs.moral + HOMES[s.home].moral);
  if (di === 5) saturday();
  if (s.day % 30 === 15) tabaski();
  if (di === 4 && s.inv.boubou){ s.needs.moral = clamp(s.needs.moral + 10); s.needs.social = clamp(s.needs.social + 12); log('Vendredi en grand boubou : tout le quartier te complimente.', 'event'); }
  if (Math.random() < .55) rollEvent();
}
function saturday(){
  const h = HOMES[s.home], lines = []; let due = 0;
  const rent = (!s.owned.includes(s.home) && h.rent) ? h.rent : 0;
  if (rent){ lines.push(['Loyer · ' + h.short, rent]); due += rent; }
  const loan = s.debt > 0 ? Math.min(s.debt, s.debtWeekly || 15000) : 0;
  if (loan){ lines.push(['Remboursement des dettes', loan]); due += loan; }
  const cot = s.tontine ? 10000 : 0;
  if (cot){ lines.push(['Cotisation tontine', cot]); due += cot; }
  if (!due && !s.tontine) return;
  let body;
  if (s.money >= due){ s.money -= due; s.debt -= loan; s.arrears = 0; body = 'Tout est réglé. Le bailleur te salue avec le sourire.'; }
  else {
    const short = due - s.money; s.money = 0; s.debt = s.debt - loan + short; s.arrears++;
    s.needs.moral = clamp(s.needs.moral - 15);
    body = 'Il te manque ' + F(short) + '. Le reste passe en dette.';
    if (rent && s.arrears >= 2 && s.home !== 'pikine'){ s.home = 'pikine'; s.arrears = 0; body += ' Deux samedis impayés : le bailleur reprend le logement. Retour à la chambre de Pikine.'; }
  }
  if (s.debt <= 0){ s.debt = 0; s.debtWeekly = 0; }
  else if (s.debtWeekly < Math.ceil(s.debt/8/500)*500) s.debtWeekly = Math.max(s.debtWeekly, Math.ceil(s.debt/8/500)*500);
  if (s.tontine){
    s.tontine.week++;
    if (s.tontine.week === s.tontine.turn){ s.money += 80000; body += ' C’est ton tour à la tontine : tu touches 80 000 F.'; }
    if (s.tontine.week >= 8){ s.tontine = null; body += ' Le cycle de la tontine est terminé.'; }
  }
  log('Samedi : ' + F(due) + ' de charges', 'money');
  queue({title:'Samedi, jour des comptes', lines, body});
}
function tabaski(){
  if (s.inv.ladoum){ applyFx({moral:45, social:45, followers:600}); queue({title:'Tabaski !', body:'Ton ladoum fait sensation : tout le quartier défile pour le prendre en photo.', fx:{moral:45, social:45, followers:600}}); }
  else if (s.inv.mouton){ s.inv.mouton = false; applyFx({moral:30, social:25}); queue({title:'Tabaski !', body:'Le mouton est prêt, la famille est réunie, les plats circulent chez les voisins.', fx:{moral:30, social:25}}); }
  else { applyFx({moral:-15, social:5}); queue({title:'Tabaski sans mouton', body:'Pas de mouton cette année. Tes voisins t’invitent quand même : c’est ça, la teranga.', fx:{moral:-15, social:5}}); }
  log('Tabaski', 'event');
}

];
function rollEvent(){
  const pool = EVENTS.filter(e => !e.cond || e.cond());
  let r = Math.random() * pool.reduce((a,e) => a + e.w, 0);
  for (const e of pool){ r -= e.w; if (r <= 0){ const ev = e.make(); if (ev.fx) applyFx(ev.fx); log(ev.title, 'event'); queue(ev); return; } }
}

// ---------------------------------------------------------------- effects
function applyFx(fx){
  if (!fx) return;
  for (const k in fx){
    const v = fx[k]; if (!v) continue;
    if (k === 'money') s.money += v;
    else if (k === 'hours') advance(v, 'awake');
    else if (k === 'followers') s.followers = Math.max(0, Math.round(s.followers + v));
    else if (k in s.needs) s.needs[k] = clamp(s.needs[k] + v);
    else if (k === 'etudes' || k === 'forme') s[k] = clamp(s[k] + v);
  }
  if (s.money < 0){ s.debt += -s.money; log('Découvert : ' + F(-s.money) + ' ajoutés à tes dettes.', 'bad'); s.money = 0; s.debtWeekly = Math.max(s.debtWeekly || 0, Math.ceil(s.debt/8/500)*500); }
}
function fxChips(fx, cost){
  const out = [];
  if (cost) out.push('<i class="fx dn">−' + F(cost) + '</i>');
  if (fx) for (const k in fx){
    const v = fx[k]; if (!v || k === 'hours') continue;
    if (k === 'money') out.push('<i class="fx money">' + (v > 0 ? '+' : '−') + F(Math.abs(v)) + '</i>');
    else if (k === 'followers') out.push('<i class="fx up">+' + num(v) + ' abonnés</i>');
    else out.push('<i class="fx ' + (v > 0 ? 'up' : 'dn') + '">' + (v > 0 ? '+' : '−') + Math.round(Math.abs(v)*10)/10 + ' ' + LABEL[k] + '</i>');
  }
  return out.join('');
}
function reqText(req){
  if (req.etudes && s.etudes < req.etudes) return 'Requiert Études ' + req.etudes + ' (tu as ' + Math.floor(s.etudes) + ')';
  if (req.xp && s.xp < req.xp) return 'Requiert ' + req.xp + ' services d’expérience (tu en as ' + s.xp + ')';
  return null;
}

// ---------------------------------------------------------------- actions
const jobLevel = id => Math.min(5, 1 + Math.floor((s.jobs[id] || 0) / 6));
function payOf(id){
  const j = JOBS[id]; let p = j.pay * (1 + .2 * (jobLevel(id) - 1));
  if ((id === 'vendeur' && perk('fatou')) || (id === 'tailleur' && perk('mame'))) p *= 1.2;
  if (s.needs.moral < 25) p *= .75;
  return Math.round(p / 100) * 100;
}
function work(id){
  const j = JOBS[id];
  return {id:'w_' + id, label:'Travailler : ' + j.name, dur:j.dur, open:j.open, fx:{energie:-j.e},
    preview:() => ({money:payOf(id), energie:-j.e}),
    meta:() => 'Niveau ' + jobLevel(id) + (s.needs.moral < 25 ? ' · moral bas −25 %' : '') + (j.bonus ? ' · + ' + (id === 'pecheur' ? 'prise' : 'pourboires') : ''),
    req:() => reqText(j.req) || (s.needs.energie < 18 ? 'Ton énergie est trop basse pour un service.' : null),
    run:() => {
      const pay = payOf(id); let bonus = 0;
      if (j.bonus) bonus = Math.round(Math.random() * j.bonus * (id === 'pecheur' && perk('ousmane') ? 2 : 1) / 100) * 100;
      const before = jobLevel(id); s.jobs[id] = (s.jobs[id] || 0) + 1; s.xp++; const after = jobLevel(id);
      return {fx:{money:pay + bonus}, msg:j.name + ' : +' + F(pay + bonus) + (bonus ? ' dont ' + F(bonus) + (id === 'pecheur' ? ' de prise' : ' de pourboires') : '') + (after > before ? ' · Promotion au niveau ' + after + ' !' : '')};
    }};
}
function food(id, label, d, cost, fx){ return {id, label, dur:d, cost, fx}; }
function talk(id){
  const n = NPCS[id];
  return {id:'talk_' + id, label:'Discuter avec ' + n.name, dur:1, fx:{social:12, moral:3},
    meta:() => n.role + ' · amitié ' + (s.friends[id] || 0) + '/5',
    req:() => s.talked[id] === s.day ? 'Tu as déjà vu ' + n.name + ' aujourd’hui.' : null,
    run:() => {
      s.talked[id] = s.day; const was = s.friends[id] || 0, lv = Math.min(5, was + 1); s.friends[id] = lv;
      return {msg: lv === 3 && was === 2 ? n.name + ' te considère comme un ami. Bonus débloqué : ' + n.perk + '.' : n.name + ' : « ' + pick(n.lines) + ' »'};
    }};
}
function post(pid, mult){
  return {id:'post_' + pid, label:'Poster une vidéo', dur:.5, fx:{energie:-4},
    meta:() => num(s.followers) + ' abonnés · 2 500 F/jour par tranche de 1 000',
    req:() => s.posted[pid] === s.day ? 'Déjà posté d’ici aujourd’hui.' : null,
    run:() => {
      s.posted[pid] = s.day;
      let g = Math.round((25 + s.needs.social * .8) * mult * (.6 + Math.random() * .9) + s.followers * .03 * Math.random());
      const viral = Math.random() < .06; if (viral) g *= 8;
      return {fx:{followers:g}, msg: viral ? 'Ta vidéo devient virale !' : 'Vidéo publiée.'};
    }};
}
function buy(k){

  return {id:'buy_' + k, label:it.name, dur:.5, cost:price, meta:() => it.desc,
    req:() => s.inv[k] ? 'Déjà à toi.' : null,

function fight(){
  const chance = () => clamp(.2 + s.forme / 150 + (perk('cheikh') ? .1 : 0), .15, .85);
  const prize = () => 25000 + Math.round(s.forme) * 3000 + s.fights.won * 10000;
  return {id:'fight', label:'Combattre dans l’arène', dur:2, open:[15,21],
    meta:() => 'Prime ' + F(prize()) + ' · ' + Math.round(chance() * 100) + ' % de chances',
    req:() => s.forme < 40 ? 'Requiert Forme 40 (tu as ' + Math.floor(s.forme) + ')' : s.flags.fought === s.day ? 'Un combat par jour, champion.' : s.needs.energie < 35 ? 'Trop peu d’énergie pour combattre.' : null,
    run:() => {
      s.flags.fought = s.day; const p = prize();
      if (Math.random() < chance()){ s.fights.won++; return {fx:{money:p, moral:25, social:15, followers:150 + s.fights.won * 50, energie:-25}, msg:'Victoire ! Ton adversaire touche le sable en premier.'}; }
      s.fights.lost++; return {fx:{moral:-18, energie:-40}, msg:'Défaite. Tu as touché le sable en premier.'};
    }};
}
function homeRows(){
  const rows = [];
  for (const [k, h] of Object.entries(HOMES)){
    if (k === 'papa') continue;
    const owned = s.owned.includes(k), cur = s.home === k;
    if (cur && owned){ rows.push({id:'hi_' + k, info:true, label:h.name, meta:() => 'Chez toi · propriétaire'}); continue; }
    if (cur) rows.push({id:'hi_' + k, info:true, label:h.name, meta:() => 'Ta location · ' + F(h.rent) + '/sem.'});
    if (owned){
      rows.push({id:'hm_' + k, label:'Emménager : ' + h.name, dur:1, meta:() => 'Tu en es propriétaire', run:() => { s.home = k; return {msg:'Tu emménages : ' + h.name + '.'}; }});
      rows.push({id:'hs_' + k, label:'Vendre : ' + h.short, dur:.5, preview:() => ({money:h.price * .8}), meta:() => 'Revente à 80 %', run:() => { s.owned = s.owned.filter(x => x !== k); return {fx:{money:h.price * .8}, msg:'Vendu : ' + h.name + '.'}; }});
      continue;
    }
    if (h.rent && !cur) rows.push({id:'hr_' + k, label:'Louer : ' + h.name, dur:1, cost:h.rent * 2, meta:() => F(h.rent) + '/sem. · caution de deux semaines', run:() => { s.home = k; s.arrears = 0; return {msg:'Nouvelle location : ' + h.name + '.'}; }});
    if (h.price) rows.push({id:'hb_' + k, label:'Acheter : ' + h.name, dur:1, cost:h.price, meta:() => cur ? 'Fini le loyer' : 'Tu emménages tout de suite', run:() => { s.owned.push(k); s.home = k; s.arrears = 0; return {msg:'Tu es propriétaire : ' + h.name + ' !'}; }});
  }
  return rows;
}

function debtRows(){

  if (s.debt > part){ const all = s.debt; rows.push({id:'repay_all', label:'Tout rembourser', dur:.5, cost:all, run:() => { s.debt = 0; s.debtWeekly = 0; return {msg:'Plus aucune dette. Libre !'}; }}); }
  return rows;
}

    ]); break;

function routes(from, to){

  if (B.island){ const j = JETTY[B.island]; b = j; bc += j.cost; bh += j.h; boats.push(j.label); }
  const d = Math.hypot(a.x - b.x, a.y - b.y), tr = s.flags.traffic === s.day, opts = [];

  if (s.inv.jakarta) add('moto', 'Ma Jakarta', 300, .05 + d/200*(tr ? 1.15 : 1), 'Se faufile partout');

    const g = $('#m-mover'), me = $('#m-me');
    const body = {car:'var(--yellow)', taxi:'var(--yellow)', rail:'var(--blue)'}[mode] || s.color;
    g.innerHTML = '<g><rect x="-9" y="-5.5" width="18" height="11" rx="3" style="fill:' + body + ';stroke:var(--card);stroke-width:1.5"/>' + (mode === 'car' ? '<rect x="-9" y="-5.5" width="18" height="3.5" rx="1.5" style="fill:var(--blue)"/>' : '') + (mode === 'taxi' ? '<rect x="-9" y="-1" width="18" height="2" style="fill:var(--on-yellow)"/>' : '') + '</g>';
    me.style.opacity = 0;

function actHtml(pid, a, here){

  curActs[a.id] = a;
  const why = blocked(pid, a), cost = costOf(a), d = durOf(a);
  const meta = [dur(d), cost ? F(cost) : (a.cost !== undefined ? 'gratuit' : null), a.meta ? a.meta() : null].filter(Boolean).join(' · ');
  const pv = a.preview ? a.preview() : fxOf(a);
  return '<button class="act" data-a="' + esc(a.id) + '"' + (why ? ' disabled' : '') + '><span class="act-main"><span class="act-label">' + esc(a.label) + '</span><span class="act-meta">' + esc(meta) + '</span>' + (why && why !== 'here' ? '<span class="act-why">' + esc(why) + '</span>' : '') + '</span><span class="act-fx">' + fxChips(pv) + '</span></button>';
}
function renderPanel(){
  const pid = sel, here = s.loc === pid, p = placeInfo(pid); curActs = {};
  const isOpen = inWin(p.open, s.hour);
  let h = '<div class="ph"><div class="eyebrow">' + CAT[p.cat] + ' · ' + esc(p.q) + '</div><h2>' + esc(p.name) + '</h2><div class="pills">' + (here ? '<span class="pill here">Tu es ici</span>' : '') + '<span class="pill ' + (isOpen ? 'open' : 'shut') + '">' + (isOpen ? 'Ouvert' : 'Fermé') + ' · ' + openText(p.open) + '</span>' + (p.rail ? '<span class="pill">TER / BRT</span>' : '') + '</div><p class="desc">' + esc(p.desc) + '</p></div>';
  if (!here){
    curRoutes = routes(s.loc, pid);
    h += '<div class="travel"><div class="travel-h">Y aller depuis ' + esc(placeInfo(s.loc).short) + '</div><div class="tgrid">' + curRoutes.map((o, i) => '<button class="tbtn' + (o.best ? ' best' : '') + '" data-t="' + i + '"' + (o.cost > s.money ? ' disabled' : '') + '><b>' + o.label + '</b><span>' + dur(o.hours) + ' · ' + (o.cost ? F(o.cost) : 'gratuit') + '</span>' + (o.note ? '<em>' + esc(o.note) + '</em>' : '') + '</button>').join('') + '</div></div>';
  }
  const ps = otherPlayers().filter(x => { const c = peerCoords(x.presence); return c && c.x === p.x && c.y === p.y; });
  if (ps.length) h += '<div class="peers-here"><span class="dots">' + ps.slice(0, 6).map(x => '<i style="background:' + (okColor(x.presence.c) ? x.presence.c : 'var(--muted)') + '"></i>').join('') + '</span><span>' + ps.length + ' autre' + (ps.length > 1 ? 's joueurs' : ' joueur') + ' ici : ' + esc(ps.slice(0, 3).map(x => String(x.presence.n || 'Quelqu’un').slice(0, 20)).join(', ')) + (ps.length > 3 ? '…' : '') + '</span></div>';
  for (const sc of sectionsFor(pid)) h += '<h3 class="sec">' + esc(sc.title) + '</h3><div class="acts">' + sc.items.map(a => actHtml(pid, a, here)).join('') + '</div>';
  $('#panel').innerHTML = h;
}
function select(id){
  if (!placeInfo(id)) return; sel = id; renderMap(); renderChips(); centerChip(); renderPanel();
  const ph = $('#panel'), r = ph.getBoundingClientRect();
  if (window.innerWidth < 900 && r.top > window.innerHeight - 140) ph.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
}

function renderMe(){
  const nw = netWorth(), h = HOMES[s.home];
  const goal = clamp(Math.log10(Math.max(nw, 1)) / 9 * 100);
  const items = Object.keys(s.inv).filter(k => s.inv[k]);
  const bizK = Object.keys(s.biz).filter(k => s.biz[k]);
  const jobsK = Object.keys(s.jobs);
  const assets = nw - s.money + s.debt;
  const passive = bizK.reduce((a, k) => a + BIZ[k].inc * s.biz[k], 0) + Math.floor(s.followers/1000)*2500;
  const sure = resetArmed;
  $('#v-moi').innerHTML = '<div class="stack two">' +
    '<div class="stack">' +
    '<div class="card idcard"><div class="av lg" style="background:' + s.color + '">' + esc(initial(s.name)) + '</div><div><h2>' + esc(s.name) + '</h2><p class="muted">' + (s.start === 'nepo' ? 'Départ : fils ou fille à papa' : 'Départ : góorgóorlu') + ' · Jour ' + s.day + '</p><p class="muted">' + esc(h.name) + (s.owned.includes(s.home) ? ' · propriétaire' : h.rent ? ' · ' + F(h.rent) + '/sem.' : '') + '</p></div></div>' +
    '<div class="card"><h3>Patrimoine net</h3><div class="big">' + F(nw) + '</div><dl class="kv"><dt>En poche</dt><dd>' + F(s.money) + '</dd><dt>Biens et business</dt><dd>' + F(assets) + '</dd><dt>Dettes</dt><dd class="' + (s.debt ? 'neg' : '') + '">' + (s.debt ? '−' + F(s.debt) : 'Aucune') + '</dd><dt>Revenus passifs</dt><dd>' + (passive ? '+' + F(passive) + '/jour' : '—') + '</dd></dl>' +
      (nw >= 1e9 ? '<span class="badge">Membre du Cercle des milliardaires</span>' : '<div class="goal"><span>Objectif : Cercle des milliardaires (1 Md F)</span><div class="bar"><i style="width:' + goal.toFixed(1) + '%"></i></div></div>') + '</div>' +
    '<div class="card"><h3>Compétences</h3><div class="meters">' +
      '<div class="meter"><span>Études<b>' + Math.floor(s.etudes) + '</b></span><div class="bar"><i style="width:' + s.etudes + '%"></i></div></div>' +
      '<div class="meter"><span>Forme<b>' + Math.floor(s.forme) + '</b></span><div class="bar"><i style="width:' + s.forme + '%"></i></div></div></div>' +
      '<dl class="kv"><dt>Expérience</dt><dd>' + s.xp + ' services</dd><dt>Abonnés</dt><dd>' + num(s.followers) + '</dd><dt>Combats</dt><dd>' + s.fights.won + ' V · ' + s.fights.lost + ' D</dd></dl></div>' +
    '</div><div class="stack">' +
    '<div class="card"><h3>Emplois</h3>' + (jobsK.length ? '<div class="rows">' + jobsK.map(k => '<div class="row"><span>' + esc(JOBS[k].name) + '</span><span>Niv. ' + jobLevel(k) + ' · ' + s.jobs[k] + ' services · ' + F(payOf(k)) + '</span></div>').join('') + '</div>' : '<p class="empty">Aucun service pour l’instant. Commence comme vendeur à Sandaga ou apprenti à Colobane.</p>') + '</div>' +
    '<div class="card"><h3>Business</h3>' + (bizK.length ? '<div class="rows">' + bizK.map(k => '<div class="row"><span>' + esc(BIZ[k].name) + ' ×' + s.biz[k] + '</span><span>+' + F(BIZ[k].inc * s.biz[k]) + '/jour</span></div>').join('') + '</div>' : '<p class="empty">Investis au Plateau : un tangana de quartier rapporte 15 000 F par jour.</p>') + '</div>' +
    '<div class="card"><h3>Possessions</h3>' + ((items.length || s.owned.length) ? '<div class="rows">' + s.owned.map(k => '<div class="row"><span>' + esc(HOMES[k].name) + '</span><span>' + F(HOMES[k].price) + '</span></div>').join('') + items.map(k => '<div class="row"><span>' + esc(ITEMS[k].name) + '</span><span>' + esc(ITEMS[k].desc) + '</span></div>').join('') + '</div>' : '<p class="empty">Rien encore. Le groupe électrogène de Sandaga change la vie pendant les délestages.</p>') + '</div>' +
    '<div class="card"><h3>Amis</h3>' + Object.keys(NPCS).map(k => { const n = NPCS[k], lv = s.friends[k] || 0; return '<div class="friend"><b>' + esc(n.name) + '</b><span class="hearts" aria-label="Amitié ' + lv + ' sur 5">' + [1,2,3,4,5].map(i => '<i class="' + (i <= lv ? 'on' : '') + '"></i>').join('') + '</span><small>' + esc(n.role) + ' · ' + (lv >= 3 ? 'Bonus : ' + esc(n.perk) : 'Amitié 3 : ' + esc(n.perk)) + '</small></div>'; }).join('') + '</div>' +
    '<div class="card"><h3>Engagements</h3><div class="rows">' +
      '<div class="row"><span>Tontine</span><span>' + (s.tontine ? 'Semaine ' + s.tontine.week + '/8 · ton tour : semaine ' + s.tontine.turn : 'Aucune · à rejoindre aux Parcelles') + '</span></div>' +
      '<div class="row"><span>Dettes</span><span>' + (s.debt ? F(s.debt) + ' · ' + F(s.debtWeekly) + ' chaque samedi' : 'Aucune') + '</span></div>' +
      '<div class="row"><span>Loyer</span><span>' + (!s.owned.includes(s.home) && h.rent ? F(h.rent) + ' chaque samedi' : 'Aucun') + '</span></div></div></div>' +
    '<div class="card"><h3>Nouvelle vie</h3><p class="muted">Efface cette partie et recommence avec un autre départ.</p><div class="danger">' + (sure ? '<button class="btn small" id="reset-yes" style="background:var(--bad);color:#fff;box-shadow:none">Tout effacer</button><button class="btn small ghost" id="reset-no">Garder ma partie</button>' : '<button class="btn small ghost" id="reset">Recommencer à zéro</button>') + '</div></div>' +
    '</div></div>';
}
function renderJournal(){
  $('#v-journal').innerHTML = '<div class="card"><h3>Journal</h3>' + (s.log.length ? '<ul class="log">' + s.log.map(e => '<li><time>J' + e.d + ' · ' + hhmm(e.h) + '</time><span class="k-' + esc(e.k) + '">' + esc(e.t) + '</span></li>').join('') + '</ul>' : '<p class="empty">Ton histoire à Dakar commence ici.</p>') + '</div>';
}

// ---------------------------------------------------------------- live (shared)
const cap = {user:null, uid:null, db:null, room:null, players:null, peers:[], readOnly:false, ready:false};
const ZONES = [...new Set(Object.values(HOMES).map(h => h.q))];
function otherPlayers(){ return (cap.peers || []).filter(p => !p.sameTab && p.kind === 'viewer' && p.presence && p.presence.g === 1); }
function peerCoords(pr){
  if (!pr || typeof pr.p !== 'string') return null;
  if (pr.p.startsWith('h:')){ const h = HOMES[pr.p.slice(2)]; return h ? {x:h.x, y:h.y} : null; }
  return P[pr.p] ? {x:P[pr.p].x, y:P[pr.p].y} : null;
}
function liveStats(){
  const today = todayStr();
  const online = cap.room ? Math.max((cap.peers || []).filter(p => p.kind === 'viewer' && p.presence && p.presence.g === 1).length, s ? 1 : 0) : (s ? 1 : 0);
  if (cap.players){
    const L = cap.players;
    return {shared:true, online, total:L.length, all:L.reduce((a, p) => a + (+p.visits || 0), 0), today:L.reduce((a, p) => a + (p.lastDay === today ? (+p.visitsToday || 0) : 0), 0), list:L};
  }
  const mine = s ? [{id:'me', name:s.name, color:s.color, netWorth:netWorth(), zone:HOMES[s.home].q}] : [];
  return {shared:false, online, total:s ? 1 : 0, all:s ? s.visits : 0, today:s && s.visitDay === today ? s.visitsToday : 0, list:mine};
}
function renderLive(){
  const host = $('#v-live'); if (!host || host.hidden) return;
  const st = liveStats();
  const top = st.list.slice().sort((a, b) => (+b.netWorth || 0) - (+a.netWorth || 0)).slice(0, 10);
  const zc = {}; for (const p of st.list) if (ZONES.includes(p.zone)) zc[p.zone] = (zc[p.zone] || 0) + 1;
  const zs = Object.entries(zc).sort((a, b) => b[1] - a[1]); const zmax = zs.length ? zs[0][1] : 1;
  const text = 'Dakar Life en direct : ' + num(st.online) + ' en ligne, ' + num(st.total) + ' joueurs, ' + num(st.today) + ' visites aujourd’hui.';
  host.innerHTML =
    (!s ? '<div class="stripe" style="margin-bottom:14px"></div>' : '') +
    '<div class="live-h"><span class="live-dot"></span>DAKAR LIFE · LIVE</div>' +
    '<h2 class="live-title">Dakar grandit, en direct.</h2>' +
    '<div class="tiles">' +
      '<div class="tile hot"><b>' + num(st.online) + '</b><span>Joueurs en ligne</span></div>' +
      '<div class="tile"><b>' + num(st.total) + '</b><span>Joueurs au total</span></div>' +
      '<div class="tile"><b>' + num(st.today) + '</b><span>Visites aujourd’hui</span></div>' +
      '<div class="tile"><b>' + num(st.all) + '</b><span>Visites au total</span></div>' +
    '</div>' +
    (st.shared ? '' : '<p class="note">' + (cap.ready ? 'Compteurs partagés indisponibles sur cet écran : seuls tes chiffres s’affichent.' : 'Connexion aux compteurs partagés…') + '</p>') +
    '<div class="stack" style="margin-top:16px">' +
    '<div class="card"><h3>Les plus riches de Dakar</h3>' + (top.length ? '<table class="lb"><tbody>' + top.map((p, i) => '<tr><td class="rk">' + (i + 1) + '</td><td><span class="nm"><i style="background:' + (okColor(p.color) ? p.color : 'var(--muted)') + '"></i><span>' + esc(String(p.name || 'Joueur').slice(0, 24)) + '</span>' + (p.id === cap.uid || p.id === 'me' ? '<span class="you">toi</span>' : '') + '</span></td><td class="nw">' + F(+p.netWorth || 0) + '</td></tr>').join('') + '</tbody></table>' : '<p class="empty">Le classement se remplit dès que les premiers joueurs arrivent.</p>') + '</div>' +
    '<div class="card"><h3>Où vivent les joueurs</h3>' + (zs.length ? '<div class="zbars">' + zs.map(([z, n]) => '<div class="zb"><span>' + esc(z) + '</span><span class="bar"><i style="width:' + (n / zmax * 100).toFixed(1) + '%"></i></span><b>' + n + '</b></div>').join('') + '</div>' : '<p class="empty">Aucun joueur encore.</p>') + '</div>' +
    '<div class="card"><h3>Espaces publicitaires</h3><div class="boards">' + [1,2,3].map(i => '<div class="board"><b>Ton affiche ici</b><span>50 000 F · 7 jours</span></div>').join('') + '</div><p class="muted" style="font-size:12.5px">Panneaux visibles sur cette page et sur la carte. Tarifs de démonstration.</p></div>' +
    '<div class="card"><h3>Partager ces chiffres</h3><p class="muted" style="font-size:13.5px">' + esc(text) + '</p><div class="share"><a class="btn small" target="_blank" rel="noopener" href="https://x.com/intent/post?text=' + encodeURIComponent(text) + '">Poster sur X</a><button class="btn small ghost" id="copy-stats">Copier le texte</button></div></div>' +
    (!s ? '<button class="btn" id="live-play">Jouer à Dakar Life</button>' : '') +
    '</div>';
  host._text = text;
}
function pushPresence(){ if (!cap.room || !s) return; try { cap.room.presence({g:1, p: s.loc === 'maison' ? 'h:' + s.home : s.loc, n:String(s.name).slice(0, 24), c:s.color}).catch(() => {}); } catch(e){} }
let syncT = null, lastSent = '', syncing = false;
function scheduleSync(){ if (!cap.db || !cap.uid || cap.readOnly || syncT) return; syncT = setTimeout(() => { syncT = null; syncPlayer(); }, 15000); }
async function syncPlayer(){
  if (!cap.db || !cap.uid || !s || cap.readOnly || syncing) return;
  const body = {name:String(s.name).slice(0, 24), color:s.color, start:s.start, zone:HOMES[s.home].q, netWorth:Math.round(netWorth()), day:s.day, visits:s.visits, visitsToday:s.visitsToday, lastDay:s.visitDay};
  const key = JSON.stringify(body); if (key === lastSent) return;
  syncing = true;
  try { await cap.db.doc('players/' + cap.uid).set(Object.assign({updatedAt:Date.now()}, body)); lastSent = key; }
  catch(e){ const c = e && e.code; if (c === 'unavailable') scheduleSync(); else if (c) cap.readOnly = true; }
  syncing = false;
}
function countVisit(){ const t = todayStr(); s.visits = (s.visits || 0) + 1; if (s.visitDay !== t){ s.visitDay = t; s.visitsToday = 1; } else s.visitsToday = (s.visitsToday || 0) + 1; }
async function registerVisit(){
  if (!cap.db || !cap.uid || !s) return;
  try { const snap = await cap.db.doc('players/' + cap.uid).get(); if (snap.exists){ const r = snap.data() || {}; if ((+r.visits || 0) >= s.visits) s.visits = (+r.visits || 0) + 1; if (r.lastDay === s.visitDay && (+r.visitsToday || 0) >= s.visitsToday) s.visitsToday = (+r.visitsToday || 0) + 1; save(); } } catch(e){}
  syncPlayer();
}
async function initCaps(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function'){ cap.ready = true; renderLive(); return; }
  try { cap.user = await C.use('user'); if (cap.user) cap.uid = await cap.user.id(); } catch(e){}
  try { cap.room = await C.use('room'); } catch(e){ cap.room = null; }
  if (cap.room){
    try { cap.room.onPeers(ch => { cap.peers = ch.peers; if (s && view === 'ville'){ renderPeersOnMap(); if (!busy) renderPanel(); } if (view === 'live') renderLive(); }, () => { cap.room = null; cap.peers = []; renderLive(); }); } catch(e){ cap.room = null; }
    pushPresence();
  }
  try { cap.db = await C.use('db'); } catch(e){ cap.db = null; }
  if (cap.db){
    try { cap.db.collection('players').orderBy('netWorth', 'desc').limit(500).onSnapshot(snap => { cap.players = snap.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data())); renderLive(); }, () => { cap.players = null; renderLive(); }); } catch(e){}
    if (s) registerVisit();
  }
  cap.ready = true; renderLive();
}

// ---------------------------------------------------------------- views & events
function setView(v){
  view = v;
  for (const id of ['ville','moi','journal']) $('#v-' + id).hidden = v !== id;
  $('#v-live').hidden = v !== 'live';
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  resetArmed = false; renderAll(); window.scrollTo({top:0});
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });
$('#map').addEventListener('click', e => { const g = e.target.closest('.pin'); if (g && !busy) select(g.dataset.p); });
$('#map').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const g = e.target.closest('.pin'); if (g){ e.preventDefault(); select(g.dataset.p); } });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b && !busy) select(b.dataset.p); });
$('#panel').addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t){ doTravel(+t.dataset.t); return; }
  const a = e.target.closest('[data-a]'); if (a) doAction(sel, a.dataset.a);
});
$('#v-moi').addEventListener('click', e => {
  if (e.target.closest('#reset')){ resetArmed = true; renderMe(); }
  else if (e.target.closest('#reset-no')){ resetArmed = false; renderMe(); }
  else if (e.target.closest('#reset-yes')){ try { localStorage.removeItem(KEY); } catch(er){} s = null; resetArmed = false; showOnboarding(); }
});
$('#v-live').addEventListener('click', e => {
  if (e.target.closest('#copy-stats')){ const txt = $('#v-live')._text || ''; try { navigator.clipboard.writeText(txt).then(() => toast('Texte copié.'), () => toast('Copie impossible ici : sélectionne le texte.', '', 'bad')); } catch(er){ toast('Copie impossible ici : sélectionne le texte.', '', 'bad'); } }
  if (e.target.closest('#live-play')){ $('#v-live').hidden = true; showOnboarding(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ save(); syncPlayer(); } else if (s){ const f = load(); if (f && f.money !== s.money){ s.money = f.money; renderAll(); } } });
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (s && view === 'ville') renderMap(); }, 150); });

// onboarding
let obColor = COLORS[0], obStart = 'gorgorlu';
function showOnboarding(){
  $('#game').hidden = true; $('#nav').hidden = true; $('#v-live').hidden = true; $('#onboard').hidden = false; $('#modal').hidden = true;
  $('#ob-colors').innerHTML = COLORS.map(c => '<button type="button" class="sw" data-c="' + c + '" style="background:' + c + '" aria-label="Couleur ' + c + '" aria-pressed="' + (c === obColor) + '"></button>').join('');
  window.scrollTo({top:0});
}
$('#ob-colors').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; obColor = b.dataset.c; document.querySelectorAll('#ob-colors .sw').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === obColor)); });
document.querySelectorAll('.start').forEach(b => b.addEventListener('click', () => { obStart = b.dataset.start; document.querySelectorAll('.start').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
$('#ob-live').addEventListener('click', () => { $('#onboard').hidden = true; $('#v-live').hidden = false; view = 'live'; renderLive(); window.scrollTo({top:0}); });
$('#ob-form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#ob-name').value.trim().replace(/\s+/g, ' ').slice(0, 20);
  if (!name){ $('#ob-name').focus(); return; }
  s = newGame(name, obColor, obStart); countVisit();
  queue({title:'Bienvenue à Dakar, ' + name, body: obStart === 'nepo'
    ? 'Tu te réveilles dans la villa familiale de Mermoz. 2 000 000 F sur ton compte, mais papa ne paiera pas éternellement. Surveille tes quatre jauges, investis au Plateau, et vise le Cercle des milliardaires.'
    : 'Tu te réveilles dans ta chambre à Pikine avec 115 000 F, dont un microcrédit de 100 000 F. Chaque samedi tombent le loyer et 15 000 F de remboursement. Commence par un service à Sandaga ou Colobane, et surveille tes quatre jauges.'});
  log('Arrivée à Dakar', 'event');
  startGame(); if (cap.db) registerVisit(); else syncPlayer();
});
function startGame(){
  $('#onboard').hidden = true; $('#game').hidden = false; $('#nav').hidden = false;
  sel = s.loc; buildMap(); setView('ville'); save(); pushPresence(); showModal();
}

// boot
function boot(data){
  const fromHot = data && data.s && data.s.v === 1;
  s = fromHot ? data.s : load();
  if (s){
    if (!fromHot) countVisit();
    if (data && data.view) view = data.view;
    $('#onboard').hidden = true; $('#game').hidden = false; $('#nav').hidden = false;
    sel = (data && data.sel) || s.loc; buildMap(); setView(view === 'live' || view === 'moi' || view === 'journal' ? view : 'ville'); save(); showModal();
  } else if (location.hash === '#live'){
    $('#v-live').hidden = false; view = 'live'; renderLive();
  } else showOnboarding();
  initCaps();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({s, sel, view})); } catch(e){} }
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body></html>
